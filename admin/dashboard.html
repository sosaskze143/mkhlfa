<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>لوحة التحكم - المدير</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="container">
    <h1>لوحة التحكم - المدير</h1>

    <!-- إضافة مستخدم -->
    <h2>إضافة مستخدم جديد</h2>
    <form id="addUserForm">
      <label>رقم الهوية:</label>
      <input type="text" id="userId" required />

      <label>الاسم الكامل:</label>
      <input type="text" id="userName" required />

      <button type="submit">إضافة المستخدم</button>
    </form>

    <hr />

    <!-- عرض المستخدمين -->
    <h2>قائمة المستخدمين</h2>
    <button onclick="loadUsers()">عرض</button>
    <div id="userList"></div>
  </div>

  <script>
    // تحميل المستخدمين من localStorage
    function getUsers() {
      return JSON.parse(localStorage.getItem("users")) || [];
    }

    // حفظ المستخدمين في localStorage
    function saveUsers(users) {
      localStorage.setItem("users", JSON.stringify(users));
    }

    // إضافة مستخدم جديد
    document.getElementById("addUserForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const id = document.getElementById("userId").value;
      const name = document.getElementById("userName").value;

      let users = getUsers();

      // التحقق إذا المستخدم موجود مسبقاً
      if (users.find(u => u.id === id)) {
        alert("المستخدم موجود مسبقاً.");
        return;
      }

      users.push({ id, name, violations: [] });
      saveUsers(users);

      alert("تمت إضافة المستخدم.");
      document.getElementById("addUserForm").reset();
    });

    // عرض المستخدمين
    function loadUsers() {
      const users = getUsers();
      let html = "";

      users.forEach(user => {
        html += `<h3>الاسم: ${user.name}</h3><p>رقم الهوية: ${user.id}</p><hr>`;
      });

      document.getElementById("userList").innerHTML = html || "<p>لا يوجد مستخدمون.</p>";
    }
  </script>
</body>
</html>
