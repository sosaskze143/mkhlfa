<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>لوحة التحكم - المدير</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="container">
    <h1>لوحة التحكم - المدير</h1>

    <!-- إضافة مستخدم -->
    <h2>إضافة مستخدم جديد</h2>
    <form id="addUserForm">
      <label>رقم الهوية:</label>
      <input type="text" id="userId" required />

      <label>الاسم الكامل:</label>
      <input type="text" id="userName" required />

      <button type="submit">إضافة المستخدم</button>
    </form>

    <hr />

    <!-- إضافة مخالفة -->
    <h2>إضافة مخالفة</h2>
    <form id="addViolationForm">
      <label>اختر المستخدم:</label>
      <select id="violationUserSelect" required></select>

      <label>سبب المخالفة:</label>
      <input type="text" id="violationReason" required />

      <label>المبلغ (ريال):</label>
      <input type="number" id="violationAmount" required />

      <button type="submit">إضافة المخالفة</button>
    </form>

    <hr />

    <!-- عرض المستخدمين -->
    <h2>قائمة المستخدمين</h2>
    <button onclick="loadUsers()">عرض</button>
    <div id="userList"></div>
  </div>

  <script>
    // تحميل المستخدمين من localStorage
    function getUsers() {
      return JSON.parse(localStorage.getItem("users")) || [];
    }

    // حفظ المستخدمين في localStorage
    function saveUsers(users) {
      localStorage.setItem("users", JSON.stringify(users));
    }

    // إضافة مستخدم جديد
    document.getElementById("addUserForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const id = document.getElementById("userId").value;
      const name = document.getElementById("userName").value;

      let users = getUsers();

      // التحقق إذا المستخدم موجود مسبقاً
      if (users.find(u => u.id === id)) {
        alert("المستخدم موجود مسبقاً.");
        return;
      }

      users.push({ id, name, violations: [] });
      saveUsers(users);

      alert("تمت إضافة المستخدم.");
      document.getElementById("addUserForm").reset();
      updateUserSelect(); // تحديث القائمة
    });

    // تعبئة قائمة المستخدمين في select
    function updateUserSelect() {
      const users = getUsers();
      const select = document.getElementById("violationUserSelect");
      select.innerHTML = "";

      users.forEach(user => {
        const option = document.createElement("option");
        option.value = user.id;
        option.textContent = `${user.name} - ${user.id}`;
        select.appendChild(option);
      });
    }

    // إضافة مخالفة
    document.getElementById("addViolationForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const userId = document.getElementById("violationUserSelect").value;
      const reason = document.getElementById("violationReason").value;
      const amount = parseFloat(document.getElementById("violationAmount").value);

      let users = getUsers();
      let user = users.find(u => u.id === userId);

      if (user) {
        user.violations.push({
          reason,
          amount,
          status: "غير مدفوعة",
          date: new Date().toLocaleDateString()
        });

        saveUsers(users);
        alert("تمت إضافة المخالفة.");
        document.getElementById("addViolationForm").reset();
      }
    });

    // عرض المستخدمين
    function loadUsers() {
      const users = getUsers();
      let html = "";

      users.forEach(user => {
        html += `<h3>الاسم: ${user.name}</h3><p>رقم الهوية: ${user.id}</p><ul>`;
        user.violations.forEach(v => {
          html += `<li>السبب: ${v.reason} | المبلغ: ${v.amount} | الحالة: ${v.status} | التاريخ: ${v.date}</li>`;
        });
        html += "</ul><hr>";
      });

      document.getElementById("userList").innerHTML = html || "<p>لا يوجد مستخدمون.</p>";
    }

    // تحديث السلكت عند تحميل الصفحة
    updateUserSelect();
  </script>
</body>
</html>
