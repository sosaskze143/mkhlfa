<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحة المستخدم</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- نموذج دخول حساب المدير -->
  <div id="loginContainer" style="text-align: center; margin-top: 10px;">
    <label for="adminPassword">دخول حساب المدير:</label>
    <input type="password" id="adminPassword" placeholder="أدخل كلمة السر" />
    <button onclick="checkPassword()">دخول</button>
  </div>

  <!-- زر لتبديل الوضع الليلي والصباحي -->
  <button id="toggleModeBtn" onclick="toggleMode()">تبديل الوضع</button>

  <h1>مرحبًا بك في صفحة المستخدم</h1>

  <form id="searchForm">
    <label for="identityInput">رقم الهوية:</label>
    <input type="text" id="identityInput" required placeholder="أدخل رقم الهوية" />
    <button type="submit">البحث</button>
  </form>

  <div id="result"></div>

  <button id="downloadBtn" style="display: none;">تحميل كشف المخالفات</button>

  <script src="js/script.js"></script>
</body>
</html>
